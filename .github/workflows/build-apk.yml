name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Prepare Android SDK Platform 35 & Build Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "::error title=SDK Manager Missing::sdkmanager not found at $SDKMGR"
            exit 1
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed Android Release APK
        run: |
          set -o pipefail
          if ! gradle -p android-app assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log; then
            ERR_SUMMARY=$(grep -E "(FAILURE:|What went wrong:|> |error:)" gradle-build.log | tail -n 15 | tr '\n' ' ')
            echo "::error title=Gradle Build Failed::$ERR_SUMMARY"
            exit 1
          fi

      - name: Prepare MadhavShivomERP.apk
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk MadhavShivomERP.apk
          ls -lh MadhavShivomERP.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadhavShivomERP-APK
          path: MadhavShivomERP.apk
          retention-days: 90

      - name: Publish Direct Download Release (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Madhav & Shivom ERP — Android Setup (APK)
          body: |
            ### 📲 Madhav Enterprises & Shivom Sales — Android ERP App
            - **Direct APK Setup File:** Download `MadhavShivomERP.apk` below and tap to install on Android mobile.
            - **Cloudflare Live Portals:** `https://madhav-enterprises.mserp.workers.dev` & `https://shivom-sales.mserp.workers.dev` (Real-time SQLite Durable Objects + WebSocket Live Sync).
            - **Built-in Support:** Native WhatsApp sharing, Print/PDF Invoices & Receipts, Excel Backup to Downloads.
          files: MadhavShivomERP.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync APK to public/downloads and push for Cloudflare
        run: |
          cp MadhavShivomERP.apk public/downloads/MadhavShivomERP.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/MadhavShivomERP.apk
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update bundled MadhavShivomERP.apk from latest build"
            git pull --rebase origin main
            git push origin main
          fi
